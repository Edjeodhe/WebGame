name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - claude/github-pages-app-deploy-1a4r24
      - main
    paths-ignore:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: insect-king
          directory: .
          # gitHubToken은 일부러 넘기지 않는다: 넘기면 액션이 GitHub Deployment
          # 기록도 남기려 시도하는데, 기본 GITHUB_TOKEN 권한(deployments: write 없음)에서는
          # 그 부가 단계가 403으로 실패해 배포 자체가 실패한 것처럼 보인다.
          # Cloudflare Pages 배포에는 필요 없는 기능이라 생략한다.
