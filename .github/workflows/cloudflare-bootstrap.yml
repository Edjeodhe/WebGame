name: Cloudflare Bootstrap (one-time KV setup)

# 최초 1회 수동 실행용. GitHub Actions 탭에서 "Run workflow"로 직접 실행해
# KV 네임스페이스를 생성하고, 로그에 찍히는 id를 worker/wrangler.toml의
# REPLACE_WITH_KV_NAMESPACE_ID 자리에 붙여넣으면 된다.
on:
  workflow_dispatch:

jobs:
  create-kv-namespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create KV namespace (SAVES_KV)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: kv namespace create SAVES_KV
