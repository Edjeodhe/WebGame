name: Cloudflare Bootstrap (one-time setup)

# 최초 1회 수동 실행용. GitHub Actions 탭에서 "Run workflow"로 직접 실행한다.
# 1) Pages 프로젝트 생성 → deploy-cloudflare-pages.yml이 이후 여기로 배포한다.
# 2) KV 네임스페이스 생성 → 로그에 찍히는 id를 worker/wrangler.toml의
#    REPLACE_WITH_KV_NAMESPACE_ID 자리에 붙여넣고 커밋해야 Worker 배포가 성공한다.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/github-pages-app-deploy-1a4r24
    paths:
      - '.github/workflows/cloudflare-bootstrap.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pages project (insect-king)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create insect-king --production-branch=claude/github-pages-app-deploy-1a4r24

      - name: Create KV namespace (SAVES_KV)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: kv namespace create SAVES_KV
